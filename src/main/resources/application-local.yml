server:
  port: 8080
  servlet:
    session:
      timeout: 30m            # 세션 만료 시간
      cookie:
        name: JSESSIONID
        http-only: true       # JS에서 쿠키 접근 차단
        # 프론트(https://ditto-global.com)가 백엔드와 다른 오리진이면
        # SESSION_COOKIE_SAME_SITE=none / SESSION_COOKIE_SECURE=true 로 띄워야
        # 브라우저가 JSESSIONID 를 실어 보낸다. none 은 secure=true 가 필수다.
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}

spring:
  # DB 계정/비밀번호는 .env (ORACLE_*, POSTGRES_*) 에서 읽고 application.yml 이 ${} 로 연결한다.

  # ===== Spring AI (AWS Bedrock) =====
  # 자격증명은 파일/깃에 넣지 않는다. IAM 역할 또는 기본 자격증명 체인(env/프로파일) 사용.
  # RAG/임베딩은 RagDataSourceConfig 가 아직 TODO 이고 모델도 미정이다.
  # 모델이 정해지고 RAG 빈을 붙일 때 embedding / vectorstore 의 none 을 해제한다.
  ai:
    model:
      embedding: none
    vectorstore:
      type: none
    bedrock:
      aws:
        region: ap-northeast-2
      converse:
        chat:
          options:
            model: ""          # 사용할 Bedrock 모델 ID (미정 — 결정 후 채움)
    # pgvector VectorStore 는 postgres datasource 에 연결한다(@Configuration 에서 JdbcTemplate 주입). TODO
    # type: none 이므로 아래 옵션은 아직 적용되지 않는다.
    #   pgvector:
    #     initialize-schema: true
    #     index-type: hnsw
    #     distance-type: cosine_distance
    #     dimensions: 1024   # 예: Titan Text Embeddings v2

# ===== AI 추천 엔진 (외부 서비스) =====
# 로컬은 파이썬 서비스를 HTTP 로, 배포 환경은 Lambda 를 함수 이름으로 직접 부른다.
#
#   로컬 : mode=http    base-url=http://127.0.0.1:8000  chat-path=/chat
#   운영 : mode=lambda  function-name=ditto-chat-v3
#
# lambda 모드는 SigV4 서명을 SDK 가 처리하고 자격증명은 EC2 인스턴스 역할에서 나온다.
# 역할에 lambda:InvokeFunction 권한이 있어야 하며, 엔진을 인터넷에 노출하지 않는다.
ditto:
  ai-engine:
    mode: ${AI_ENGINE_MODE:http}
    base-url: ${AI_ENGINE_BASE_URL:http://127.0.0.1:8000}
    chat-path: ${AI_ENGINE_CHAT_PATH:/chat}
    function-name: ${AI_ENGINE_FUNCTION_NAME:ditto-chat-v3}
    # 셀럽 조사 방식. 비워 두면 엔진 기본값(tavily). builtin 으로 되돌릴 수 있다.
    engine: ${AI_ENGINE_ENGINE:}
    region: ${AWS_REGION:ap-northeast-2}
    connect-timeout: 5s
    # 한 턴에 LLM 을 여러 번 호출하고 웹 검색까지 붙는다.
    read-timeout: 120s

  # ===== 승인 대기 코스 초안 (관리자 조회 전용) =====
  # ditto-celeb-warm-2 가 매일 만들어 Redis 에 하루 두는 초안을 읽기만 한다.
  # 초안을 만들거나 지우거나 서빙 캐시로 올리지 않는다 — 그건 배치와 승인 람다의 일이다.
  #
  # ai-engine 과 달리 HTTP 모드가 없다. 초안 창구는 Lambda 안에서만 열리는 Redis 를 보므로
  # 로컬에 같은 것을 띄울 방법이 없다. 로컬은 AWS profile, 배포 환경은 EC2 인스턴스 역할로
  # 자격증명을 얻으며 lambda:InvokeFunction 권한이 있어야 한다.
  celeb-draft:
    function-name: ${CELEB_DRAFT_FUNCTION_NAME:ditto-celeb-warm-2}
    region: ${AWS_REGION:ap-northeast-2}
    connect-timeout: 5s
    # 조회 창구는 Redis 를 한 번 읽고 끝난다. 짧아야 람다가 죽었을 때 화면이 안 매달린다.
    read-timeout: 10s

  # ===== 코스 승인 (관리자 쓰기) =====
  # 관리자가 고친 초안을 손님 캐시(celeb:course:*)로 올리고 초안을 지운다.
  # celeb-draft 와 따로 두는 것은 저쪽이 조회 전용이고 타임아웃 정책이 다르기 때문이다.
  celeb-approve:
    function-name: ${CELEB_APPROVE_FUNCTION_NAME:ditto-celeb-approve}
    region: ${AWS_REGION:ap-northeast-2}
    connect-timeout: 5s
    # Redis 네 번 + Oracle MERGE + 만료 행 청소. 콜드스타트도 있다.
    read-timeout: 30s

  # ===== 실내 지도 원장 자산 =====
  # 층 그래프·장소 원장·방 폴리곤은 한 번 만들어지면 바뀌지 않는 정적 파일이라 S3 에 두고
  # CloudFront(course-resource/*)로 내보낸다. 백엔드는 그 파일을 대신 실어 나르지 않는다 —
  # 588KB 를 EC2 로 통과시키면 CDN 을 둔 이유가 사라진다. 어디에 있는지만 알려 준다.
  #
  # 비워 두면 프론트가 자기 public/ 안의 사본으로 떨어진다.
  map-assets:
    base-url: ${MAP_ASSET_BASE_URL:https://d1bxld598du04o.cloudfront.net/course-resource/navigation/v2}
    max-age-seconds: ${MAP_ASSET_MAX_AGE:1814400}

  # ===== OCR 간판 인식 길찾기 =====
  # 세션은 인메모리로 관리한다. 인식은 네이버 CLOVA OCR(외부) 에 맡긴다.
  # invoke-url·secret 은 CLOVA 콘솔에서 발급하며 소스에 두지 않고 .env 로 공급한다.
  ocr:
    session-ttl: 30m
    max-candidates: 5
    brand-top-n: 5
    preprocess:
      enabled: true
      max-long-side-px: 1600
      max-bytes: 1048576
      jpeg-quality: 0.82
    matching:
      fuzzy-threshold: 0.8
      min-fuzzy-length: 4
      min-match-score: 0.8
    clova:
      invoke-url: ${CLOVA_OCR_INVOKE_URL:}
      secret: ${CLOVA_OCR_SECRET:}
      connect-timeout: 5s
      read-timeout: 30s

# ===== MyBatis =====
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.ditto
  configuration:
    map-underscore-to-camel-case: true   # snake_case ↔ camelCase 매핑

# ===== Logging =====
logging:
  level:
    root: INFO
    com.ditto: DEBUG
    org.mybatis: DEBUG
    org.springframework.security: DEBUG
