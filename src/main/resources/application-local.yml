server:
  port: 8080
  servlet:
    session:
      timeout: 30m            # 세션 만료 시간
      cookie:
        name: JSESSIONID
        http-only: true       # JS에서 쿠키 접근 차단
        secure: false         # 운영(HTTPS)에서는 true
        same-site: lax        # 크로스 사이트 요청 시 쿠키 정책

spring:
  # DB 계정/비밀번호는 .env (ORACLE_*, POSTGRES_*) 에서 읽고 application.yml 이 ${} 로 연결한다.

  # ===== Spring AI (AWS Bedrock) =====
  # 자격증명은 파일/깃에 넣지 않는다. IAM 역할 또는 기본 자격증명 체인(env/프로파일) 사용.
  # RAG/임베딩은 RagDataSourceConfig 가 아직 TODO 이고 모델도 미정이다.
  # 모델이 정해지고 RAG 빈을 붙일 때 embedding / vectorstore 의 none 을 해제한다.
  ai:
    model:
      embedding: none
    vectorstore:
      type: none
    bedrock:
      aws:
        region: ap-northeast-2
      converse:
        chat:
          options:
            model: ""          # 사용할 Bedrock 모델 ID (미정 — 결정 후 채움)
    # pgvector VectorStore 는 postgres datasource 에 연결한다(@Configuration 에서 JdbcTemplate 주입). TODO
    # type: none 이므로 아래 옵션은 아직 적용되지 않는다.
    #   pgvector:
    #     initialize-schema: true
    #     index-type: hnsw
    #     distance-type: cosine_distance
    #     dimensions: 1024   # 예: Titan Text Embeddings v2

# ===== AI 추천 엔진 (외부 서비스) =====
# 로컬은 파이썬 서비스, 운영은 Lambda Function URL. 바뀌는 것은 아래 세 줄뿐이고 자바 코드는 그대로다.
#
#   로컬 : base-url=http://127.0.0.1:8000  chat-path=/chat  auth=none
#   운영 : base-url=https://xxx.lambda-url.ap-northeast-2.on.aws  chat-path=/  auth=aws-iam
ditto:
  ai-engine:
    base-url: ${AI_ENGINE_BASE_URL:http://127.0.0.1:8000}
    chat-path: ${AI_ENGINE_CHAT_PATH:/chat}
    # none    : 서명 없이 호출
    # aws-iam : 기본 자격증명 체인으로 SigV4 서명해 호출한다.
    #           Function URL 이 AuthType=AWS_IAM 이면 필수이며,
    #           EC2 에서는 인스턴스 역할이 자격증명을 주므로 액세스 키를 두지 않는다.
    auth: ${AI_ENGINE_AUTH:none}
    region: ${AWS_REGION:ap-northeast-2}
    connect-timeout: 5s
    # 첫 요청은 BGE-m3 적재(약 2GB)가 붙고, 한 턴에 LLM 을 2~3회 호출한다.
    read-timeout: 120s

# ===== MyBatis =====
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.ditto
  configuration:
    map-underscore-to-camel-case: true   # snake_case ↔ camelCase 매핑

# ===== Logging =====
logging:
  level:
    root: INFO
    com.ditto: DEBUG
    org.mybatis: DEBUG
    org.springframework.security: DEBUG
