spring:
  profiles:
    active: local
  application:
    name: ditto
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false
  datasource:
    oracle:
      jdbc-url: ${ORACLE_JDBC_URL}
      username: ${ORACLE_USERNAME}
      password: ${ORACLE_PASSWORD}
      driver-class-name: oracle.jdbc.OracleDriver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # RAG 빈이 붙기 전까지 Bedrock 임베딩·pgvector 자동설정을 끈다.
  # bedrock 스타터가 Titan + Cohere EmbeddingModel 을 동시에 만들면
  # PgVectorStore 가 어느 쪽을 쓸지 못 고르고 기동이 실패한다.
  ai:
    model:
      embedding: none
    vectorstore:
      type: none

# MyBatis (XML 매퍼 방식)
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

# SpringDoc OpenAPI (Swagger UI)
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

# S3 이미지 저장소
# 자격증명은 소스에 두지 않고 로컬 AWS profile 또는 EC2 IAM Role로 공급한다.
app:
  storage:
    s3:
      bucket: ${AWS_S3_BUCKET}
      region: ${AWS_REGION:ap-northeast-2}
      prefix: ${AWS_S3_PREFIX:images}
      public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}
      presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:30m}
  translation:
    enabled: ${AWS_TRANSLATE_ENABLED:false}
    region: ${AWS_TRANSLATE_REGION:${AWS_REGION:ap-northeast-2}}
    max-request-bytes: ${AWS_TRANSLATE_MAX_REQUEST_BYTES:9000}
    pending-lease: ${AWS_TRANSLATE_PENDING_LEASE:2m}
    retry-base: ${AWS_TRANSLATE_RETRY_BASE:5m}
    retry-max: ${AWS_TRANSLATE_RETRY_MAX:24h}

# Actuator Health Check
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized

# K-컬처 뉴스피드 자동 생성 설정
news-feed:
  generation:
    scheduler-enabled: true
    cron: "0 0 6 * * *"
    max-feeds-per-topic: 3
    topics:
      - K-POP

# Google Gemini API
gemini:
  api-key: ${GEMINI_API_KEY:}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
  connect-timeout-seconds: 5
  read-timeout-seconds: 30
  enabled: true
