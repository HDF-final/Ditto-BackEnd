# Cloudflare tunnel / ALB 등 리버스 프록시 뒤에서 원래 스킴(https)을 인식한다.
# 이게 없으면 Secure 쿠키가 내려가지 않고 리다이렉트 URL 이 http 로 나간다.
server:
  forward-headers-strategy: framework

spring:
  profiles:
    active: local
  application:
    name: ditto
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false
  datasource:
    oracle:
      jdbc-url: ${ORACLE_JDBC_URL}
      username: ${ORACLE_USERNAME}
      password: ${ORACLE_PASSWORD}
      driver-class-name: oracle.jdbc.OracleDriver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # RAG 빈이 붙기 전까지 Bedrock 임베딩·pgvector 자동설정을 끈다.
  # bedrock 스타터가 Titan + Cohere EmbeddingModel 을 동시에 만들면
  # PgVectorStore 가 어느 쪽을 쓸지 못 고르고 기동이 실패한다.
  ai:
    model:
      embedding: none
    vectorstore:
      type: none

# MyBatis (XML 매퍼 방식)
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

# SpringDoc OpenAPI (Swagger UI)
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

# CORS 허용 오리진
# 자격 증명을 실어 보내므로 와일드카드 없이 정확한 Origin 만 적는다.
#
# localhost:3000 은 프론트를 로컬에서 띄운 채 배포된 백엔드를 보게 하려는 것이다.
# 보통은 이 경로를 안 탄다 — next.config.mjs 가 /api/* 를 서버 사이드로 프록시해서
# 브라우저는 같은 오리진만 부른다. 브라우저가 ALB 를 직접 부르는 설정
# (NEXT_PUBLIC_API_BASE_URL 을 절대 주소로 둘 때)에서만 필요하다.
#
# 대가가 있다: 관리자가 로그인한 브라우저에서 localhost:3000 에 뜬 다른 페이지가
# 그 세션으로 API 를 부를 수 있다. 로컬 개발이 끝나면 CORS_ALLOWED_ORIGINS 로
# 배포 도메인만 남기고 좁힌다.
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://ditto-global.com,http://localhost:3000}

  # S3 이미지 저장소
  # 자격증명은 소스에 두지 않고 로컬 AWS profile 또는 EC2 IAM Role로 공급한다.
  storage:
    s3:
      bucket: ${AWS_S3_BUCKET}
      region: ${AWS_REGION:ap-northeast-2}
      prefix: ${AWS_S3_PREFIX:images}
      public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}
      presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:30m}
  translation:
    enabled: ${AWS_TRANSLATE_ENABLED:false}
    region: ${AWS_TRANSLATE_REGION:${AWS_REGION:ap-northeast-2}}
    max-request-bytes: ${AWS_TRANSLATE_MAX_REQUEST_BYTES:9000}
    pending-lease: ${AWS_TRANSLATE_PENDING_LEASE:2m}
    retry-base: ${AWS_TRANSLATE_RETRY_BASE:5m}
    retry-max: ${AWS_TRANSLATE_RETRY_MAX:24h}

# Actuator Health Check
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized

