spring:
  profiles:
    active: local
  application:
    name: ditto
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false
  datasource:
    oracle:
      jdbc-url: ${ORACLE_JDBC_URL}
      username: ${ORACLE_USERNAME}
      password: ${ORACLE_PASSWORD}
      driver-class-name: oracle.jdbc.OracleDriver
  # RAG 빈이 붙기 전까지 Bedrock 임베딩·pgvector 자동설정을 끈다.
  # bedrock 스타터가 Titan + Cohere EmbeddingModel 을 동시에 만들면
  # PgVectorStore 가 어느 쪽을 쓸지 못 고르고 기동이 실패한다.
  ai:
    model:
      embedding: none
    vectorstore:
      type: none

# MyBatis (XML 매퍼 방식)
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

# SpringDoc OpenAPI (Swagger UI)
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

# Actuator Health Check
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized
