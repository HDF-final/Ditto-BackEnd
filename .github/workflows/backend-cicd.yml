name: Backend CI/CD (ASG Rolling Deployment)

on:
  workflow_dispatch:
  push:
    branches:
      - dev

concurrency:
  group: backend-dev-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 601202752151.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPOSITORY: ditto-backend
  ASG_NAME: asg-hdf-backend
  LAUNCH_TEMPLATE_NAME: HDF-lt-hdf-backend

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run tests
        run: ./gradlew test --no-daemon

  deploy:
    name: Build, Push & ASG Refresh
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. AWS OIDC 자격 증명 획득
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHubActions-DittoBackend
          aws-region: ${{ env.AWS_REGION }}

      # 2. Amazon ECR 로그인
      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 3. Docker 이미지 빌드 및 ECR 푸시
      - name: Build and push image
        shell: bash
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}"
          docker build --platform linux/amd64 \
            --tag "${IMAGE_URI}:${GITHUB_SHA}" \
            --tag "${IMAGE_URI}:latest" \
            .
          docker push "${IMAGE_URI}:${GITHUB_SHA}"
          docker push "${IMAGE_URI}:latest"

      # 4. 시작 템플릿 새 버전 생성 (새 이미지 태그 반영)
      - name: Create new Launch Template version
        id: create-lt
        shell: bash
        run: |
          # 시작 템플릿의 기본 User Data 스크립트 작성
          USER_DATA_SCRIPT=$(cat << 'EOF'
          #!/bin/bash
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt update -y
          apt install -y docker.io docker-compose-v2 curl unzip jq

          cd /tmp
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          ./aws/install
          rm -rf awscliv2.zip aws/

          systemctl enable --now docker
          usermod -aG docker ubuntu

          APP_DIR="/opt/ditto"
          mkdir -p "$APP_DIR"
          chown -R ubuntu:ubuntu "$APP_DIR"

          AWS_REGION="ap-northeast-2"
          ECR_REGISTRY="601202752151.dkr.ecr.ap-northeast-2.amazonaws.com"
          ECR_REPOSITORY="ditto-backend"

          cat << 'COMPOSE_EOF' > "$APP_DIR/docker-compose.yml"
          services:
            backend:
              image: "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG:-latest}"
              container_name: ditto-backend
              restart: unless-stopped
              env_file:
                - ${ENV_FILE:-.env}
              ports:
                - "8080:8080"
              healthcheck:
                test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
                interval: 30s
                timeout: 5s
                retries: 5
                start_period: 60s
              logging:
                driver: json-file
                options:
                  max-size: "10m"
                  max-file: "3"
          COMPOSE_EOF

          cat << ENV_EOF > "$APP_DIR/.env"
          ECR_REGISTRY=${ECR_REGISTRY}
          ECR_REPOSITORY=${ECR_REPOSITORY}
          IMAGE_TAG=latest
          # 실제 Spring Boot DB 환경변수 주입
          SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          ENV_EOF

          /usr/local/bin/aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          docker compose -f "$APP_DIR/docker-compose.yml" pull
          docker compose -f "$APP_DIR/docker-compose.yml" up -d
          EOF
          )

          ENCODED_USER_DATA=$(echo "$USER_DATA_SCRIPT" | base64 -w 0)

          NEW_VERSION=$(aws ec2 create-launch-template-version \
            --launch-template-name "${LAUNCH_TEMPLATE_NAME}" \
            --source-version '$Latest' \
            --launch-template-data "{\"UserData\":\"${ENCODED_USER_DATA}\"}" \
            --query 'LaunchTemplateVersion.VersionNumber' \
            --output text)

          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT

      # 5. ASG 시작 템플릿 버전 갱신
      - name: Update ASG Launch Template version
        shell: bash
        run: |
          aws autoscaling update-auto-scaling-group \
            --auto-scaling-group-name "${ASG_NAME}" \
            --launch-template "LaunchTemplateName=${LAUNCH_TEMPLATE_NAME},Version=${{ steps.create-lt.outputs.NEW_VERSION }}"

      # 6. ASG 인스턴스 새로고침(Instance Refresh) 실행 및 완료 대기
      - name: Trigger and monitor ASG Instance Refresh
        shell: bash
        run: |
          echo "Starting Instance Refresh for ASG: ${ASG_NAME}..."
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "${ASG_NAME}" \
            --preferences '{"MinHealthyPercentage": 100, "InstanceWarmup": 60}' \
            --query 'InstanceRefreshId' \
            --output text)

          echo "Instance Refresh ID: $REFRESH_ID"

          while true; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "${ASG_NAME}" \
              --instance-refresh-ids "${REFRESH_ID}" \
              --query 'InstanceRefreshes[0].Status' \
              --output text)

            echo "Current refresh status: $STATUS"

            if [ "$STATUS" = "Successful" ]; then
              echo "✅ Instance Refresh completed successfully without downtime!"
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "❌ Instance Refresh failed or was cancelled."
              exit 1
            fi

            sleep 15
          done